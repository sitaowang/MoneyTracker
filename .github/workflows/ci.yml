# .github/workflows/ci.yml
name: Qt MoneyTracker CMake CI  # 工作流名称，GitHub Actions 页面会显示这个名字

on:  # 触发条件
  push:
    branches: [ main, master ]      # 推送到 main 或 master 分支时触发
  pull_request:
    branches: [ main, master ]      # 向 main/master 发起 PR 时触发

jobs:
  build-and-test:
    runs-on: ubuntu-latest            # 使用最新的 Ubuntu 环境

    steps:
      # 步骤1：检出代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：安装 Qt6 和必要的依赖
      - name: Install Qt6 and dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6core6 \
            libqt6gui6 \
            libqt6widgets6 \
            cmake \
            ninja-build \
            build-essential \
            libgl1-mesa-dev

      # 步骤3：配置 CMake（生成构建文件）
      - name: Configure CMake
        run: |
          cmake -B build \
                -S . \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja

      # 步骤4：编译整个项目（包括主程序和测试）
      - name: Build project
        run: |
          cmake --build build --config Release -j$(nproc)

      # 步骤5：运行单元测试和集成测试
      - name: Run tests
        working-directory: build
        run: |
          g++ -o tst_test tst_test.cpp
          ./tests/tst_test
